<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolución de la IA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============================================================ -->
  <!-- VISTA 1: HOME                                                  -->
  <!-- ============================================================ -->
  <main id="viewHome" class="view view--home">
    <h1 class="home__title">
      <span class="accent">Evolución</span> de la <span class="accent">IA</span>: desde sus orígenes a la actualidad
    </h1>
    <p class="home__subtitle">¿Qué te gustaría explorar primero?</p>

    <div class="home__options">

      <button type="button" class="option" id="btnStartInfografia" aria-label="Explorar cuándo nos empezó a ganar la IA">
        <div class="option__icon knight-icon" aria-hidden="true"></div>
        <p class="option__label">¿Cuando nos empezó a ganar la IA?</p>
      </button>

      <div class="divider" aria-hidden="true"></div>

      <div class="option option--inactive" aria-disabled="true" title="Próximamente">
        <svg class="option__icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="currentColor" d="M12 14a10 10 0 0 1 10-10h76a10 10 0 0 1 10 10v58a10 10 0 0 1-10 10H46l-22 22V82H22a10 10 0 0 1-10-10Z"/>
        </svg>
        <p class="option__label">¿Cuando empezó la IA a entendernos?</p>
      </div>

    </div>
  </main>

  <!-- ============================================================ -->
  <!-- VISTA 2: INFOGRAFÍA INTERACTIVA (ajedrez)                      -->
  <!-- ============================================================ -->
  <main id="viewInfografia" class="view view--infografia" hidden>

    <button type="button" class="home-link" id="btnBackHome" aria-label="Volver al inicio">←</button>

    <div class="stage">

      <!-- Panel de texto -->
      <section class="panel panel--text">
        <div class="year" id="year">1914</div>
        <h2 class="title" id="title">Un nuevo contrincante</h2>
        <p class="desc" id="desc"></p>

        <div class="photo-wrap" id="photoWrap">
          <img id="photo" src="" alt="">
        </div>

        <div class="prompt prompt--scroll" id="promptScroll">
          <span>Scroll</span>
          <svg viewBox="0 0 24 36" class="mouse-icon"><rect x="2" y="2" width="20" height="32" rx="10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="8" width="4" height="9" rx="2" fill="currentColor"/></svg>
          <svg viewBox="0 0 20 12" class="arrow-icon"><path d="M1 1 L10 10 L19 1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>

        <div class="prompt prompt--click" id="promptClick" hidden>
          <svg viewBox="0 0 24 36" class="mouse-icon"><rect x="2" y="2" width="20" height="32" rx="10" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="8" width="4" height="9" rx="2" fill="currentColor"/></svg>
          <span>Hacé click en la casilla marcada para continuar</span>
        </div>

        <div class="final" id="finalPanel" hidden>
          <p class="final__caption" id="finalCaption">Jaque Mate de la IA en 9 movimientos</p>
          <button type="button" class="final__btn" id="btnFinalHome">Volver al inicio</button>
        </div>
      </section>

      <!-- Panel del tablero -->
      <section class="panel panel--board">
        <div class="timeline" id="timeline">
          <svg id="timelineSvg" viewBox="0 0 360 70" preserveAspectRatio="xMidYMid meet"></svg>
        </div>

        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board"></div>
        </div>
      </section>

    </div>
  </main>

<script src="script.js"></script>
</body>
</html>
